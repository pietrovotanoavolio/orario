  <script src="/_aistudio-iframe.js?v=2c34bde1"></script></head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-rose-500 selection:text-white" style="font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif;">
    <div id="root">
      <!-- Instant Zero-JS Pre-render Container (hydrates in <2ms from localStorage) -->
      <div id="instant-shell" style="min-height:100vh;background-color:#060a16;color:#ffffff;display:flex;flex-direction:column;align-items:center;padding:12px;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;">
        <div style="width:100%;max-width:448px;display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px 0;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#DE7959,#CF6846);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(222,121,89,0.3);flex-shrink:0;">
              <svg viewBox="0 0 512 512" style="width:100%;height:100%;padding:4px;">
                <circle cx="256" cy="256" r="96" fill="none" stroke="#FFFFFF" stroke-width="42"/>
              </svg>
            </div>
            <div>
              <div style="font-weight:900;font-size:16px;letter-spacing:-0.5px;color:#ffffff;">ORARIO COMPATTO</div>
              <div style="font-size:11px;font-weight:600;letter-spacing:0.5px;color:#94a3b8;margin-top:2px;">by Pietro Votano Avolio</div>
            </div>
          </div>
          <div style="display:flex;gap:6px;">
            <div style="width:34px;height:34px;border-radius:8px;background:#16254c;opacity:0.6;"></div>
            <div style="width:34px;height:34px;border-radius:8px;background:#16254c;opacity:0.6;"></div>
          </div>
        </div>

        <!-- Timetable square mount -->
        <div id="instant-grid-mount" style="width:100%;max-width:400px;aspect-ratio:1/1;background:#ffffff;border:1.5px solid #000000;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,0.5);">
          <!-- Populated instantly from localStorage below -->
        </div>
      </div>

      <script>
        (function() {
          try {
            var raw = localStorage.getItem('compact_orari_list_v2');
            var activeId = localStorage.getItem('compact_orario_active_id');
            var sched = null;
            if (raw) {
              var list = JSON.parse(raw);
              if (Array.isArray(list) && list.length > 0) {
                sched = list.find(function(s) { return s && s.id === activeId; }) || list[0];
              }
            }
            var mount = document.getElementById('instant-grid-mount');
            if (mount) {
              var dCount = (sched && sched.daysCount) || 5;
              var hCount = (sched && sched.hoursCount) || 7;
              var cells = (sched && sched.cells) || {};
              var showDetails = sched && sched.showDetails !== undefined ? sched.showDetails : true;
              var html = '';
              for (var h = 0; h < hCount; h++) {
                html += '<div style="flex:1;display:flex;border-bottom:' + (h === hCount - 1 ? 'none' : '1px solid #000') + ';">';
                for (var d = 0; d < dCount; d++) {
                  var key = d + '-' + h;
                  var c = cells[key];
                  var cl = (c && c.classe) || '';
                  var p = (c && c.piano) || '';
                  var a = (c && c.aula) || '';
                  var comp = (c && c.compresenza) || '';
                  p = p.replace(/^[pP]\.\s*/, '').replace(/^[pP]\s+(?=\d)/, '').trim();
                  a = a.replace(/^[aA]\.\s*/, '').replace(/^[aA]\s+(?=\d)/, '').trim();
                  var hasDet = showDetails && (p || a || comp);
                  var det = '';
                  if (hasDet) {
                    det = (p ? '<span style="color:#dc2626;font-weight:800;">' + p + '</span>' : '') +
                          (p && (a || comp) ? ' ' : '') +
                          (a ? '<span>' + a + '</span>' : '') +
                          (a && comp ? ' ' : '') +
                          (comp ? '<span style="color:#1d4ed8;font-weight:800;">' + comp + '</span>' : '');
                  }

                  html += '<div style="flex:1;border-right:' + (d === dCount - 1 ? 'none' : '1px solid #000') + ';display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;overflow:hidden;padding:2px;text-align:center;">' +
                          (cl ? '<div style="font-weight:900;color:#000;font-size:18px;line-height:1;letter-spacing:-0.5px;">' + cl + '</div>' : '') +
                          (det ? '<div style="font-weight:800;color:#000;font-size:13px;margin-top:2px;line-height:1;">' + det + '</div>' : '') +
                          '</div>';
                }
                html += '</div>';
              }
              mount.innerHTML = html;
            }
          } catch(e) {}
        })();
      </script>
    </div>
  </body>
</html>
